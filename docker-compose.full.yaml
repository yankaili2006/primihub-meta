version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: primihub-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=primihub
      - MYSQL_DATABASE=meta
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./script/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pprimihub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:2.0.3
    container_name: primihub-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - TZ=Asia/Shanghai
    restart: unless-stopped

  meta-api:
    image: primihub/meta-api:latest
    build:
      context: .
      dockerfile: Dockerfile.meta-api
    container_name: primihub-meta-api
    ports:
      - "8099:8099"
      - "9099:9099"
    environment:
      - TZ=Asia/Shanghai
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/meta?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
